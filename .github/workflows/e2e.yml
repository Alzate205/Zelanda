name: E2E Tests

# El e2e siembra y borra datos en la MISMA base que usa la finca: no hay
# proyecto de Supabase aparte para CI. Mientras corre, el lote "E2E Lote Test"
# con sus 50 árboles y cuatro usuarios de prueba están visibles en la app real,
# y si el jefe la abre en ese momento ve datos que no existen.
#
# Por eso no corre solo en cada push. Se pide a mano desde la pestaña Actions,
# o se le pone la etiqueta `e2e` a la PR que se quiera probar. El día que haya
# una base aparte para CI, esto vuelve a `push` sin más.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]

jobs:
  e2e:
    # En las PR sólo corre si alguien pidió el e2e con la etiqueta. A mano
    # (`workflow_dispatch`) corre siempre.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-latest
    # Sin esto rige el default de GitHub: 6 horas. Un paso colgado se queda
    # ocupando un runner toda la tarde y el PR se ve "en progreso" como si
    # estuviera trabajando. Pasó de verdad dos veces seguidas: la descarga de
    # navegadores se trabó 30 y 36 minutos, cuando normalmente tarda uno.
    # El job entero suele correr en unos 5 minutos.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # La misma línea que se usa en desarrollo. Además, --env-file-if-exists
          # de global-setup necesita Node 20.12 o superior.
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
        env:
          # `postinstall` corre `prisma generate`, que valida las variables que
          # el schema referencia aunque no toque la base.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
      - name: Install Playwright browsers
        # Es una descarga, y las descargas se cuelgan. Normalmente toma 1-2 min.
        timeout-minutes: 8
        run: npx playwright install --with-deps chromium
      # La suite corre contra este build, no contra `next dev`. Con dev, cada
      # ruta se compilaba en el primer acceso y ese costo caía dentro del test
      # que llegara primero: tres corridas del mismo commit fallaron en tres
      # tests distintos.
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}

      - name: Run Playwright tests
        timeout-minutes: 12
        run: npx playwright test --config=playwright.config.ts --reporter=list
        env:
          # El servidor de Next y el seed corren dentro de este paso, así que
          # necesitan todo lo que la app pide para arrancar y para hablar con
          # Supabase. Antes solo llegaban las dos primeras y la suite ni salía.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
      - name: Guardar el informe cuando algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
