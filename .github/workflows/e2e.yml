name: E2E Tests

on:
  push:
    branches: [main, 'mejoras/*']
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # La misma línea que se usa en desarrollo. Además, --env-file-if-exists
          # de global-setup necesita Node 20.12 o superior.
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
        env:
          # `postinstall` corre `prisma generate`, que valida las variables que
          # el schema referencia aunque no toque la base.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: npx playwright test --config=playwright.config.ts --reporter=list
        env:
          # El servidor de Next y el seed corren dentro de este paso, así que
          # necesitan todo lo que la app pide para arrancar y para hablar con
          # Supabase. Antes solo llegaban las dos primeras y la suite ni salía.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
      - name: Guardar el informe cuando algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
